name: nyaya-guard-ci
on:
  push:
    paths: ["projects/nyaya-guard/**"]
  pull_request:
    paths: ["projects/nyaya-guard/**"]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nyaya-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/nyaya-guard/package.json
      - run: npm ci
      - run: npm test
      - run: npm run eval
